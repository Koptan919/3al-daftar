name: EAS Update

# كل push على main: بيشغّل الاختبارات، وإذا نجحت بيبعت تحديث OTA لقناة production.
# على الـ pull requests: بيشغّل الاختبارات بس.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  update:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::لازم تضيف EXPO_TOKEN بـ Settings → Secrets and variables → Actions"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Check project is linked to EAS
        id: linked
        run: |
          if node -e 'const c=require("./app.json").expo; process.exit(c.extra?.eas?.projectId && c.updates?.url ? 0 : 1)'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::المشروع مش مربوط بـ EAS بعد. شغّل «Build APK» مرة وحدة (Actions → Build APK → Run workflow)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish update to production
        if: steps.linked.outputs.ok == 'true'
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: eas update --channel production --message "$MESSAGE" --non-interactive
