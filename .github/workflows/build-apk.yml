name: Build APK

# بيبني APK على GitHub (بلا حساب Expo) وبيوقّعو بمفتاح دائم، وبيحطّو بـ Releases.
# رابط التحميل الثابت لآخر نسخة:
#   https://github.com/Koptan919/3al-daftar/releases/latest/download/daftar-al-dayn.apk
#
# بيشتغل يدوياً (Actions → Build APK → Run workflow)،
# أو لحالو لما يتغيّر app.json على main (مثلاً لما تكبّر رقم version).
#
# مفتاح التوقيع:
# - أول مرة بينعمل مفتاح RSA-4096، بيتشفّر بـ AES-256 بكلمة السر KEYSTORE_PASSWORD
#   (من Secrets)، وبينحفظ مشفّر بـ signing/daftar.jks.enc مع بصمتو.
# - كل build بيفك التشفير، بيوقّع، وبيتأكد إنو بصمة الـ APK = البصمة المحفوظة.
# - ⚠️ لا تمحي ولا تبدّل المفتاح أبداً، وإلا التلفونات ما بتقبل التحديث فوق النسخة القديمة.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [app.json]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Check for KEYSTORE_PASSWORD
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD مش موجود. زيدو بـ Settings → Secrets and variables → Actions → Repository secrets (6 أحرف أو أكتر)"
            exit 1
          fi
          if [ ${#KEYSTORE_PASSWORD} -lt 6 ]; then
            echo "::error::KEYSTORE_PASSWORD لازم يكون 6 أحرف أو أكتر"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # الـ runner فيه Android SDK جاهز (ANDROID_HOME)، ما في داعي ننزّلو
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/build-tools" || { echo "::error::Android SDK مش موجود على الـ runner"; exit 1; }
          ls "$ANDROID_HOME/build-tools"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

      - name: Signing key (create once, then reuse)
        run: |
          mkdir -p signing
          KS="$RUNNER_TEMP/daftar.jks"
          if [ ! -f signing/daftar.jks.enc ]; then
            echo "أول مرة: عم نعمل مفتاح توقيع جديد"
            keytool -genkeypair -v -storetype PKCS12 -keystore "$KS" -alias daftar \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Daftar Al Dayn, O=3al-daftar, C=LB"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in "$KS" -out signing/daftar.jks.enc -pass env:KEYSTORE_PASSWORD
            keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias daftar \
              | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f' \
              > signing/fingerprint-sha256.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/daftar.jks.enc signing/fingerprint-sha256.txt
            git commit -m "مفتاح توقيع الـ APK (مشفّر)"
            git push origin HEAD:main
          else
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                -in signing/daftar.jks.enc -out "$KS" -pass env:KEYSTORE_PASSWORD; then
              echo "::error::ما قدرنا نفك تشفير المفتاح. KEYSTORE_PASSWORD مش نفس كلمة السر اللي انعمل فيها المفتاح."
              exit 1
            fi
          fi
          echo "DAFTAR_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "DAFTAR_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DAFTAR_KEY_ALIAS=daftar" >> "$GITHUB_ENV"

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # حجم أصغر: بس معالجات التلفونات الحقيقية (بلا x86 تبع الـ emulator)،
        # ضغط المكتبات جوّا الـ APK، وشيل الكود والموارد اللي ما بتنستعمل
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pexpo.useLegacyPackaging=true \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Verify signature fingerprint
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep 'SHA-256 digest' | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED=$(tr -d ' \n' < signing/fingerprint-sha256.txt)
          echo "expected=$EXPECTED"
          echo "actual=$ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::بصمة توقيع الـ APK مش مطابقة للبصمة المحفوظة"
            exit 1
          fi
          cp "$APK" daftar-al-dayn.apk
          echo "APK size: $(du -h daftar-al-dayn.apk | cut -f1)"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./app.json").expo.version')
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" daftar-al-dayn.apk \
            --target main \
            --title "دفتر الدين ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "نزّل daftar-al-dayn.apk على التلفون وافتحو لتثبّتو. التحديثات الصغيرة بتوصل لحالها بلا ما تعيد التثبيت." \
            --latest
          {
            echo "## ✅ الـ APK جاهز (نسخة ${VERSION})"
            echo ""
            echo "**رابط التحميل (دايماً آخر نسخة):**"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/daftar-al-dayn.apk"
          } >> "$GITHUB_STEP_SUMMARY"
